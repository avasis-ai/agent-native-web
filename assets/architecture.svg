<!-- Hallmark · pre-emit critique: P5 H5 E5 S5 R5 V4 · alignment grid: 72px -->
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
  <title id="title">Agent Native Web architecture</title>
  <desc id="desc">One authoritative domain core serves both the human HTML interface and direct agent interfaces including HTTP, CLI, MCP, and NLWeb, with media, state, and transaction safety layers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08110F"/><stop offset="1" stop-color="#111A1A"/></linearGradient>
  </defs>

  <rect width="1440" height="800" rx="26" fill="url(#bg)"/>
  <rect x="1" y="1" width="1438" height="798" rx="25" fill="none" stroke="#B8FFD8" stroke-opacity=".16"/>
  <text x="72" y="80" fill="#F2FAF6" font-family="Inter, ui-sans-serif, system-ui" font-size="38" font-weight="750">One domain model. Two native interfaces.</text>
  <text x="72" y="118" fill="#8FA39C" font-family="Inter, ui-sans-serif, system-ui" font-size="19">The browser is a human adapter, not the agent runtime.</text>

  <path d="M368 300h72M1000 300h72M720 430v80" fill="none" stroke="#526A62" stroke-width="3"/>
  <circle cx="404" cy="300" r="5" fill="#75A7FF"/>
  <circle cx="1036" cy="300" r="5" fill="#B8FFD8"/>
  <path d="m712 500 8 10 8-10" fill="none" stroke="#526A62" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(72 208)" font-family="Inter, ui-sans-serif, system-ui">
    <rect width="296" height="184" rx="20" fill="#111B1A" stroke="#2F433D"/>
    <circle cx="32" cy="34" r="8" fill="#75A7FF"/>
    <text x="52" y="42" fill="#DDE8FF" font-size="18" font-weight="700" letter-spacing="2">HUMAN SURFACE</text>
    <text x="28" y="92" fill="#F0F5F3" font-size="25" font-weight="720">HTML storefront</text>
    <text x="28" y="127" fill="#91A39D" font-size="18">CSS · forms · visual layout</text>
    <rect x="28" y="146" width="190" height="26" rx="13" fill="#18232B"/>
    <text x="42" y="166" fill="#9AB8F3" font-family="ui-monospace, monospace" font-size="16">Accept: text/html</text>
  </g>

  <g transform="translate(440 170)" font-family="Inter, ui-sans-serif, system-ui">
    <rect width="560" height="260" rx="28" fill="#B8FFD8"/>
    <text x="40" y="56" fill="#173128" font-size="18" font-weight="800" letter-spacing="2.6">AUTHORITATIVE CORE</text>
    <text x="40" y="108" fill="#07100F" font-size="32" font-weight="800">Domain services + policy</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#173128">
      <text x="42" y="160">products · carts · orders</text>
      <text x="42" y="194">validation · revisions · events</text>
      <text x="42" y="228">persistence · audit · receipts</text>
    </g>
  </g>

  <g transform="translate(1072 208)" font-family="Inter, ui-sans-serif, system-ui">
    <rect width="296" height="184" rx="20" fill="#111B1A" stroke="#2F433D"/>
    <circle cx="32" cy="34" r="8" fill="#B8FFD8"/>
    <text x="52" y="42" fill="#DDF7E8" font-size="18" font-weight="700" letter-spacing="2">AGENT SURFACE</text>
    <text x="28" y="92" fill="#F0F5F3" font-size="25" font-weight="720">Typed capabilities</text>
    <text x="28" y="127" fill="#91A39D" font-size="18">HTTP · CLI · MCP · NLWeb</text>
    <rect x="28" y="146" width="240" height="26" rx="13" fill="#14231E"/>
    <text x="42" y="166" fill="#B8FFD8" font-family="ui-monospace, monospace" font-size="16">Accept: application/ld+json</text>
  </g>

  <g transform="translate(72 520)" font-family="Inter, ui-sans-serif, system-ui">
    <g>
      <rect width="416" height="208" rx="22" fill="#111B1A" stroke="#2F433D"/>
      <text x="28" y="45" fill="#75A7FF" font-size="18" font-weight="800" letter-spacing="2">DIRECT MEDIA</text>
      <text x="28" y="86" fill="#F0F5F3" font-size="23" font-weight="720">Original bytes, not screenshots</text>
      <text x="28" y="122" fill="#91A39D" font-size="18">Source images · addressable regions</text>
      <text x="28" y="151" fill="#91A39D" font-size="18">Chart data · scene graphs · hashes</text>
      <rect x="28" y="174" width="120" height="7" rx="4" fill="#75A7FF"/>
      <rect x="156" y="174" width="68" height="7" rx="4" fill="#324B68"/>
      <rect x="232" y="174" width="140" height="7" rx="4" fill="#23303C"/>
    </g>

    <g transform="translate(440)">
      <rect width="416" height="208" rx="22" fill="#111B1A" stroke="#2F433D"/>
      <text x="28" y="45" fill="#B8FFD8" font-size="18" font-weight="800" letter-spacing="2">LIVE STATE</text>
      <text x="28" y="86" fill="#F0F5F3" font-size="23" font-weight="720">Baseline once, deltas after</text>
      <text x="28" y="122" fill="#91A39D" font-size="18">Stable IDs · monotonic sequences</text>
      <text x="28" y="151" fill="#91A39D" font-size="18">SSE · JSON Patch · gap recovery</text>
      <path d="M30 180h70l22-18 26 28 27-15 36 5 32-31 29 31h112" fill="none" stroke="#B8FFD8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(880)">
      <rect width="416" height="208" rx="22" fill="#111B1A" stroke="#2F433D"/>
      <text x="28" y="45" fill="#FF8066" font-size="18" font-weight="800" letter-spacing="2">SAFE TRANSACTIONS</text>
      <text x="28" y="86" fill="#F0F5F3" font-size="23" font-weight="720">Preview before consequence</text>
      <text x="28" y="122" fill="#91A39D" font-size="18">Approval · stale-state rejection</text>
      <text x="28" y="151" fill="#91A39D" font-size="18">Idempotent commit · durable receipt</text>
      <g transform="translate(28 170)" font-family="ui-monospace, monospace" font-size="16" text-anchor="middle">
        <rect width="92" height="25" rx="12" fill="#281A17"/><text x="46" y="19" fill="#FFB6A6">preview</text>
        <path d="M100 12h24" stroke="#5E4944"/>
        <rect x="132" width="92" height="25" rx="12" fill="#281A17"/><text x="178" y="19" fill="#FFB6A6">commit</text>
        <path d="M232 12h24" stroke="#5E4944"/>
        <rect x="264" width="92" height="25" rx="12" fill="#14231E"/><text x="310" y="19" fill="#B8FFD8">receipt</text>
      </g>
    </g>
  </g>
</svg>
