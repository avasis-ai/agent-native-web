<!-- Hallmark · pre-emit critique: P5 H5 E5 S5 R5 V4 · alignment grid: 72px -->
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Browserless purchase demo</title>
  <desc id="desc">A verified run summary showing discovery, direct image-region reading, preview, commit, state delta, checkout approval, and two receipts, with zero HTML, render, screenshot, and browser dependency counts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08110F"/><stop offset="1" stop-color="#12191B"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="22" stdDeviation="28" flood-opacity=".35"/></filter>
  </defs>

  <rect width="1440" height="760" rx="26" fill="url(#bg)"/>
  <text x="72" y="76" fill="#F2FAF6" font-family="Inter, ui-sans-serif, system-ui" font-size="34" font-weight="750">One command. No browser process.</text>
  <text x="72" y="112" fill="#8FA39C" font-family="Inter, ui-sans-serif, system-ui" font-size="18">The agent consumes capabilities and source media directly.</text>

  <g transform="translate(72 148)" filter="url(#shadow)">
    <rect width="1296" height="536" rx="20" fill="#050908" stroke="#2C3D38"/>
    <line x1="888" y1="36" x2="888" y2="500" stroke="#1C2A26"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="36" y="43" fill="#B8FFD8" font-size="16" font-weight="700" letter-spacing="2.2">VERIFIED RUN</text>
      <text x="36" y="88" fill="#B8FFD8" font-size="18">$</text>
      <text x="62" y="88" fill="#E4ECE8" font-size="18" font-weight="650">npm run demo</text>
      <line x1="36" y1="110" x2="852" y2="110" stroke="#1C2A26"/>

      <g font-size="19">
        <text x="36" y="148" fill="#71837C">01</text><text x="88" y="148" fill="#D4DED9">discover</text><text x="310" y="148" fill="#B8FFD8">agent-resource-web v0.1</text>
        <text x="36" y="186" fill="#71837C">02</text><text x="88" y="186" fill="#D4DED9">query</text><text x="310" y="186" fill="#F0F5F3">“blue waterproof” → Trailpack 28L</text>
        <text x="36" y="224" fill="#71837C">03</text><text x="88" y="224" fill="#D4DED9">media.region</text><text x="310" y="224" fill="#75A7FF">source pixels → NOVA731</text>
        <text x="36" y="262" fill="#71837C">04</text><text x="88" y="262" fill="#D4DED9">state</text><text x="310" y="262" fill="#F0F5F3">cart baseline @ sequence 0</text>
        <text x="36" y="300" fill="#71837C">05</text><text x="88" y="300" fill="#D4DED9">preview</text><text x="310" y="300" fill="#F0F5F3">add 1 × Trailpack · no mutation</text>
        <text x="36" y="338" fill="#71837C">06</text><text x="88" y="338" fill="#D4DED9">commit</text><text x="310" y="338" fill="#B8FFD8">receipt_dd47… · sequence 1</text>
        <text x="36" y="376" fill="#71837C">07</text><text x="88" y="376" fill="#D4DED9">state.patch</text><text x="310" y="376" fill="#F0F5F3">3 cart fields · 0 catalog retransmits</text>
        <text x="36" y="414" fill="#71837C">08</text><text x="88" y="414" fill="#D4DED9">checkout.preview</text><text x="310" y="414" fill="#FFB6A6">USD 129.00 · high risk · approval required</text>
        <text x="36" y="452" fill="#71837C">09</text><text x="88" y="452" fill="#D4DED9">approved + commit</text><text x="310" y="452" fill="#B8FFD8">receipt_fc48… · order placed once</text>
      </g>

      <text x="924" y="43" fill="#75A7FF" font-size="16" font-weight="700" letter-spacing="2.2">SERVER TRACE</text>
      <g font-size="16" font-weight="700" letter-spacing="1.4">
        <g transform="translate(924 70)"><rect width="336" height="68" rx="12" fill="#111B1A" stroke="#20322D"/><circle cx="24" cy="34" r="5" fill="#B8FFD8"/><text x="42" y="39" fill="#9EB0AA">HTML REQUESTS</text><text x="308" y="43" fill="#F2FAF6" font-size="26" text-anchor="end">0</text></g>
        <g transform="translate(924 154)"><rect width="336" height="68" rx="12" fill="#111B1A" stroke="#20322D"/><circle cx="24" cy="34" r="5" fill="#B8FFD8"/><text x="42" y="39" fill="#9EB0AA">RENDER ROUTES</text><text x="308" y="43" fill="#F2FAF6" font-size="26" text-anchor="end">0</text></g>
        <g transform="translate(924 238)"><rect width="336" height="68" rx="12" fill="#111B1A" stroke="#20322D"/><circle cx="24" cy="34" r="5" fill="#B8FFD8"/><text x="42" y="39" fill="#9EB0AA">SCREENSHOTS</text><text x="308" y="43" fill="#F2FAF6" font-size="26" text-anchor="end">0</text></g>
        <g transform="translate(924 322)"><rect width="336" height="68" rx="12" fill="#151D28" stroke="#24334B"/><circle cx="24" cy="34" r="5" fill="#75A7FF"/><text x="42" y="39" fill="#A9B9D8">BROWSER DEPS</text><text x="308" y="43" fill="#F2FAF6" font-size="26" text-anchor="end">0</text></g>
        <g transform="translate(924 406)"><rect width="336" height="68" rx="12" fill="#14231E" stroke="#28503F"/><circle cx="24" cy="34" r="5" fill="#FF8066"/><text x="42" y="39" fill="#AFC2B9">RECEIPTS</text><text x="308" y="43" fill="#B8FFD8" font-size="26" text-anchor="end">2</text></g>
      </g>
    </g>
  </g>
</svg>
