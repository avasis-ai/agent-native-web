<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Browserless purchase demo</title>
  <desc id="desc">A terminal transcript showing discovery, direct image-region reading, preview, commit, state delta, checkout approval, and receipt, with zero HTML, render, and screenshot requests.</desc>
  <defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08110F"/><stop offset="1" stop-color="#12191B"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="22" stdDeviation="28" flood-opacity=".35"/></filter></defs>
  <rect width="1440" height="760" rx="26" fill="url(#b)"/>
  <text x="78" y="75" fill="#F2FAF6" font-family="Inter, ui-sans-serif, system-ui" font-size="34" font-weight="750">One command. No browser process.</text>
  <text x="78" y="110" fill="#8FA39C" font-family="Inter, ui-sans-serif, system-ui" font-size="18">The agent consumes capabilities and source media directly.</text>
  <g transform="translate(78 148)" filter="url(#s)">
    <rect width="1284" height="536" rx="20" fill="#050908" stroke="#2C3D38"/>
    <rect width="1284" height="56" rx="20" fill="#111A18"/><rect y="36" width="1284" height="20" fill="#111A18"/>
    <circle cx="30" cy="28" r="7" fill="#FF8066"/><circle cx="54" cy="28" r="7" fill="#F6CA6A"/><circle cx="78" cy="28" r="7" fill="#B8FFD8"/>
    <text x="642" y="34" text-anchor="middle" fill="#6F827B" font-family="ui-monospace, monospace" font-size="13">agentweb · browserless-demo</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">
      <text x="34" y="96" fill="#B8FFD8">$</text><text x="58" y="96" fill="#E4ECE8">npm run demo</text>
      <text x="34" y="137" fill="#71837C">01</text><text x="82" y="137" fill="#D4DED9">discover</text><text x="262" y="137" fill="#B8FFD8">agent-resource-web v0.1</text>
      <text x="34" y="177" fill="#71837C">02</text><text x="82" y="177" fill="#D4DED9">query</text><text x="262" y="177" fill="#F0F5F3">“blue waterproof” → Trailpack 28L</text>
      <text x="34" y="217" fill="#71837C">03</text><text x="82" y="217" fill="#D4DED9">media.region</text><text x="262" y="217" fill="#75A7FF">source pixels → NOVA731</text>
      <text x="34" y="257" fill="#71837C">04</text><text x="82" y="257" fill="#D4DED9">state</text><text x="262" y="257" fill="#F0F5F3">cart baseline @ sequence 0</text>
      <text x="34" y="297" fill="#71837C">05</text><text x="82" y="297" fill="#D4DED9">preview</text><text x="262" y="297" fill="#F0F5F3">add 1 × Trailpack · no mutation</text>
      <text x="34" y="337" fill="#71837C">06</text><text x="82" y="337" fill="#D4DED9">commit</text><text x="262" y="337" fill="#B8FFD8">receipt_dd47… · sequence 1</text>
      <text x="34" y="377" fill="#71837C">07</text><text x="82" y="377" fill="#D4DED9">state.patch</text><text x="262" y="377" fill="#F0F5F3">3 cart fields · 0 catalog retransmits</text>
      <text x="34" y="417" fill="#71837C">08</text><text x="82" y="417" fill="#D4DED9">checkout.preview</text><text x="262" y="417" fill="#FFB6A6">USD 129.00 · high risk · approval required</text>
      <text x="34" y="457" fill="#71837C">09</text><text x="82" y="457" fill="#D4DED9">approved + commit</text><text x="262" y="457" fill="#B8FFD8">receipt_fc48… · order placed once</text>
    </g>
    <line x1="34" y1="484" x2="1250" y2="484" stroke="#1C2A26"/>
    <g transform="translate(34 503)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="650">
      <g><rect width="215" height="42" rx="10" fill="#13201C"/><circle cx="20" cy="21" r="5" fill="#B8FFD8"/><text x="35" y="26" fill="#DDF3E7">HTML requests: 0</text></g>
      <g transform="translate(230)"><rect width="215" height="42" rx="10" fill="#13201C"/><circle cx="20" cy="21" r="5" fill="#B8FFD8"/><text x="35" y="26" fill="#DDF3E7">render requests: 0</text></g>
      <g transform="translate(460)"><rect width="242" height="42" rx="10" fill="#13201C"/><circle cx="20" cy="21" r="5" fill="#B8FFD8"/><text x="35" y="26" fill="#DDF3E7">screenshot requests: 0</text></g>
      <g transform="translate(717)"><rect width="237" height="42" rx="10" fill="#17202C"/><circle cx="20" cy="21" r="5" fill="#75A7FF"/><text x="35" y="26" fill="#DDE7FF">browser dependencies: 0</text></g>
    </g>
  </g>
</svg>
