    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="650" text-anchor="middle">
      <g transform="translate(48 29)"><rect width="120" height="54" rx="12" fill="#14201D" stroke="#B8FFD8" stroke-opacity=".4"/><text x="60" y="35" fill="#B8FFD8">agent</text></g>
      <path d="M180 56h36m-8-6 8 6-8 6" fill="none" stroke="#3D514B" stroke-width="2"/>
      <g transform="translate(228 29)"><rect width="120" height="54" rx="12" fill="#111B1A" stroke="#2A3A36"/><text x="60" y="35" fill="#DDE8E3">discover</text></g>
      <path d="M360 56h36m-8-6 8 6-8 6" fill="none" stroke="#3D514B" stroke-width="2"/>
      <g transform="translate(408 29)"><rect width="120" height="54" rx="12" fill="#111B1A" stroke="#2A3A36"/><text x="60" y="35" fill="#DDE8E3">query</text></g>
      <path d="M540 56h36m-8-6 8 6-8 6" fill="none" stroke="#3D514B" stroke-width="2"/>
