<!-- Hallmark · pre-emit critique: P5 H5 E5 S5 R5 V4 · alignment grid: 72px -->
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">Agent Native Web</title>
  <desc id="desc">A dark technical banner showing an agent moving through discovery, query, media, preview, commit, and receipt without using a browser.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07100F"/>
      <stop offset="0.56" stop-color="#0B1715"/>
      <stop offset="1" stop-color="#10191B"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0" stop-color="#B8FFD8" stop-opacity=".14"/>
      <stop offset="1" stop-color="#B8FFD8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#B8FFD8" stroke-opacity=".055"/>
    </pattern>
  </defs>

  <rect width="1440" height="720" rx="28" fill="url(#bg)"/>
  <rect width="1440" height="720" rx="28" fill="url(#glow)"/>
  <rect width="1440" height="720" rx="28" fill="url(#grid)"/>
  <rect x="1" y="1" width="1438" height="718" rx="27" fill="none" stroke="#B8FFD8" stroke-opacity=".18"/>

  <g transform="translate(72 72)">
    <rect width="52" height="52" rx="14" fill="#B8FFD8"/>
    <path d="M14 16h13c8 0 14 6 14 14v5M14 39h14c7 0 13-6 13-13v-5" fill="none" stroke="#0A1211" stroke-width="5" stroke-linecap="round"/>
    <circle cx="14" cy="16" r="5" fill="#75A7FF"/>
    <circle cx="14" cy="39" r="5" fill="#0A1211"/>
    <path d="m33 26 8-8 8 8" fill="none" stroke="#FF8066" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="144" y="108" fill="#E9F4EF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" font-weight="700" letter-spacing="3">AGENT NATIVE WEB</text>

  <text x="72" y="224" fill="#F5FBF8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="72" font-weight="760" letter-spacing="-3">The web, without the</text>
  <text x="72" y="306" fill="#B8FFD8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="72" font-weight="760" letter-spacing="-3">browser in the loop.</text>
  <text x="72" y="365" fill="#9EB0AA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24">Typed capabilities, direct media, live state, safe actions, durable receipts.</text>

  <g transform="translate(72 416)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="650">
    <g>
      <rect width="200" height="44" rx="22" fill="#12211D" stroke="#B8FFD8" stroke-opacity=".42"/>
      <circle cx="23" cy="22" r="6" fill="#B8FFD8"/>
      <text x="39" y="29" fill="#DFF5E9">94 / 94 tests</text>
    </g>
    <g transform="translate(216)">
      <rect width="200" height="44" rx="22" fill="#151F2A" stroke="#75A7FF" stroke-opacity=".42"/>
      <circle cx="23" cy="22" r="6" fill="#75A7FF"/>
      <text x="39" y="29" fill="#DFE9FF">0 browser deps</text>
    </g>
    <g transform="translate(432)">
      <rect width="200" height="44" rx="22" fill="#261A16" stroke="#FF8066" stroke-opacity=".42"/>
      <circle cx="23" cy="22" r="6" fill="#FF8066"/>
      <text x="39" y="29" fill="#FFE7DF">0 screenshots</text>
    </g>
  </g>

  <g transform="translate(72 528)">
